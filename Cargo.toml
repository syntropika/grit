[package]
name = "hyfa"
version = "0.4.0"
edition = "2024"
description = "Graph-ranked Issues and Tasks for GitHub"
license = "MIT"
rust-version = "1.94.0"
repository = "https://github.com/syntropika/hyfa"
homepage = "https://github.com/syntropika/hyfa"
readme = "README.md"
keywords = ["github", "issues", "graph", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", ".skill/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "CHANGELOG.md", "docs/**", "CONTEXT.md"]

[lib]
name = "hyfa"

[[bin]]
name = "hyfa"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1.3"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.45", features = ["derive"] }
directories = "6.0.0"
fs2 = "0.4.3"
hex = "0.4.3"
keyring = "4.2.0"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustix = { version = "1.1.4", features = ["fs"] }
schemars = "1.2.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
skillinstaller = { version = "=0.1.0", default-features = false }
thiserror = "2.0.16"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zeroize = "1.8.2"

[dev-dependencies]
mockito = "1.7.0"
tempfile = "3.21.0"
tungstenite = "0.28.0"
yaml-rust2 = { version = "0.11.0", default-features = false }
