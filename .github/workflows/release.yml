name: Build and release Grit

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: grit-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.94.0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check release identity and packaging guards
        run: |
          python3 scripts/release.py check
          python3 -m unittest discover -s scripts -p 'release_test.py' -v
      - name: Install the pinned native Rust toolchain
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          test "$(rustc +"$RUST_TOOLCHAIN" -vV | sed -n 's/^host: //p')" = "$RELEASE_TARGET"
          printf 'CARGO_TARGET_DIR=%s/grit-release-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Test and lint on the target platform
        run: |
          cargo +"$RUST_TOOLCHAIN" test --locked --all-targets --all-features
          cargo +"$RUST_TOOLCHAIN" clippy --locked --all-targets --all-features -- -D warnings
          cargo +"$RUST_TOOLCHAIN" fmt --all -- --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          node-version: "24.14.0"
      - name: Test browser-independent graph behavior
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: node --test tests/network_view.test.js
      - name: Build, package, and smoke-test the extracted release
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          cargo +"$RUST_TOOLCHAIN" build --release --locked
          python3 scripts/release.py package --target "$RELEASE_TARGET" --binary "$CARGO_TARGET_DIR/release/grit" --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish complete release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify every archive, upload a draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --output dist
